name: Linting before Coolify Deploy

on:
  push:
    branches: main

jobs:
  lint:
    name: Run Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  deploy:
    name: Trigger Coolify Deployment
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Call Coolify Webhook
        run: |
          curl --request GET "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" \
               --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
